<text x="1010.0" y="190.0" font-family="sans-serif" font-size="15" fill="#1a1d21" text-anchor="start" font-weight="700" letter-spacing="0">What this settles</text>
<text x="1010.0" y="222.0" font-family="monospace" font-size="10.5" fill="#1a1d21" text-anchor="start" font-weight="700" letter-spacing="0">No holes today.</text>
<text x="1010.0" y="238.0" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="start" font-weight="400" letter-spacing="0">Standoffs (Pi, buck) bond to the lid underside with epoxy or</text>
<text x="1010.0" y="252.0" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="start" font-weight="400" letter-spacing="0">neutral-cure silicone. Cable ties go on adhesive mounts. The gasket</text>
<text x="1010.0" y="266.0" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="start" font-weight="400" letter-spacing="0">band stays untouched.</text>
<text x="1010.0" y="296.0" font-family="monospace" font-size="10.5" fill="#1a1d21" text-anchor="start" font-weight="700" letter-spacing="0">One hole, later.</text>
<text x="1010.0" y="312.0" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="start" font-weight="400" letter-spacing="0">The camera tower bore, 32.6 x 37.6 mm, cut only when the camera is</text>
<text x="1010.0" y="326.0" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="start" font-weight="400" letter-spacing="0">verified and the printed tower has been test-fitted to the real</text>
<text x="1010.0" y="340.0" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="start" font-weight="400" letter-spacing="0">fisheye (U2/U3).</text>
<text x="1010.0" y="370.0" font-family="monospace" font-size="10.5" fill="#1a1d21" text-anchor="start" font-weight="700" letter-spacing="0">Ribbon.</text>
<text x="1010.0" y="386.0" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="start" font-weight="400" letter-spacing="0">CSI connector at (-5, -11); tower centre at (-6, -35).</text>
<text x="1010.0" y="400.0" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="start" font-weight="400" letter-spacing="0">roofbox_check.py puts the FFC path at ~90 mm of the 110 mm on hand.</text>
<text x="1010.0" y="430.0" font-family="monospace" font-size="10.5" fill="#1a1d21" text-anchor="start" font-weight="700" letter-spacing="0">Field.</text>
<text x="1010.0" y="446.0" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="start" font-weight="400" letter-spacing="0">Everything sits inside +/-58 mm - clear of the seal channel - and</text>
<text x="1010.0" y="460.0" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="start" font-weight="400" letter-spacing="0">no two footprints overlap. Checked numerically, not by eye.</text>
<text x="1010.0" y="490.0" font-family="monospace" font-size="10.5" fill="#1a1d21" text-anchor="start" font-weight="700" letter-spacing="0">Stack.</text>
<text x="1010.0" y="506.0" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="start" font-weight="400" letter-spacing="0">Lid -&gt; Pi standoff 10 -&gt; Pi -&gt; 12.8 socket -&gt; HAT: 44.5 mm to the</text>
<text x="1010.0" y="520.0" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="start" font-weight="400" letter-spacing="0">tallest part, in 178 mm of box.</text>
<text x="1010.0" y="550.0" font-family="monospace" font-size="10.5" fill="#1a1d21" text-anchor="start" font-weight="700" letter-spacing="0">Glands.</text>
<text x="1010.0" y="566.0" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="start" font-weight="400" letter-spacing="0">Not on the lid. Three PG7 (12.5 mm holes) in one side wall, 32 mm</text>
<text x="1010.0" y="580.0" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="start" font-weight="400" letter-spacing="0">up, 34 mm apart - templates/roofbox_drill_wall.svg.</text>
<text x="1010.0" y="1090.0" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="start" font-weight="400" letter-spacing="0">Generated by scripts/gen_drawings.py from docs/cad/roofbox.scad - change the CAD, not this sheet.</text>
